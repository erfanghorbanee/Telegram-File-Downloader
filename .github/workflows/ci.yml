name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: requirements-dev.txt

      - name: Check formatting
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: requirements-dev.txt
          args: "format --check --diff"

  smoke-test:
    # Catches dependency updates that break the script, without needing
    # Telegram credentials or network access to Telegram.
    name: Smoke test (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show help (must work without credentials)
        run: python main.py --help

      - name: Missing credentials give a clear error, not a crash
        run: |
          set +e
          output=$(python main.py --list 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q "TELEGRAM_API_ID"
