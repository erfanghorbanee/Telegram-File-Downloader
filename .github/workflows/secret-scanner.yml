name: Secret Scanner

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions are pinned to full commit SHAs (tags can be moved; SHAs can't).
      # Dependabot keeps the SHAs and version comments up to date.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so TruffleHog can scan every new commit
          persist-credentials: false # the scanner doesn't need a git token

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
