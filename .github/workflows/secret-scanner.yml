name: Secret Scanner

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions are pinned to full commit SHAs (tags can be moved; SHAs can't).
      # Dependabot keeps the SHAs and version comments up to date.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so TruffleHog can scan every new commit
          persist-credentials: false # the scanner doesn't need a git token

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          extra_args: --results=verified,unknown
